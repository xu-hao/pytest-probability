[project]
name = "pytest-probability"
version = "0.3.0"
description = "pytest plugin for nondeterministic tests: run cases N times, report empirical pass fractions, flaky detection, and cost."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hao Xu" }]
keywords = ["pytest", "llm", "benchmark", "flaky", "evaluation", "eval", "probability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.4",
]

[project.optional-dependencies]
# Test-only: reference implementations the stats module is checked
# against, and pytest-xdist for exercising -n runs. Never runtime deps.
test = [
    "pytest-xdist",
    "scipy",
    "statsmodels",
]

[project.urls]
Homepage = "https://github.com/xu-hao/pytest-probability"
Repository = "https://github.com/xu-hao/pytest-probability"
Documentation = "https://pytest-probability.readthedocs.io"
Changelog = "https://github.com/xu-hao/pytest-probability/blob/main/docs/changelog.md"

[project.entry-points.pytest11]
probability = "pytest_probability.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_probability"]

[tool.pytest.ini_options]
markers = [
    "slow: longer-running statistical checks (deselect with -m 'not slow')",
]
